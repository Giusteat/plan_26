<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berlin Fitness Weekly Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Berlin Fitness Schedule</h1>
    <div class="meta" id="meta">Carico gli orari…</div>
    <div class="week-nav">
        <button id="prevWeek" aria-label="Settimana precedente">‹</button>
        <span class="week-label" id="weekLabel"></span>
        <button id="nextWeek" aria-label="Settimana successiva">›</button>
    </div>
    <div class="filters-wrapper">
        <div class="filters" id="categoryFilters"></div>
        <div class="divider"></div>
        <div class="filters" id="venueFilters"></div>
    </div>
    <div class="calendar-grid-wrapper">
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
