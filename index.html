<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fitness Schedule</title>
    <!-- carica sempre l'ultima versione di stile e codice (il browser altrimenti tiene quella vecchia per 10 minuti) -->
    <script>document.write('<link rel="stylesheet" href="style.css?v=' + Date.now() + '">');</script>
    <noscript><link rel="stylesheet" href="style.css"></noscript>
</head>
<body>
<header>
    <div class="top">
        <a class="ico left" href="gestisci.html" title="Gestisci palestre" aria-label="Gestisci palestre">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
        </a>
        <h1>Fitness Schedule</h1>
        <span class="meta" id="meta">Carico gli orari…</span>
        <a class="ico" href="confronto.html" title="Confronto abbonamenti" aria-label="Confronto abbonamenti">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="2" y="9" width="4" height="9" rx="1"/><rect x="8" y="3" width="4" height="15" rx="1"/><rect x="14" y="6" width="4" height="12" rx="1"/></svg>
        </a>
    </div>
    <label class="search mob">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg>
        <input type="search" id="q" placeholder="Palestre, lezioni e categorie" autocomplete="off" aria-label="Cerca">
    </label>
    <div class="bar">
        <div class="filters" id="filters"></div>
    </div>
    <div class="range mob">
        <span id="fromL"></span>
        <div class="dual" id="dual">
            <input type="range" id="from" min="300" max="1380" step="30" aria-label="Dalle ore">
            <input type="range" id="to" min="300" max="1380" step="30" aria-label="Alle ore">
        </div>
        <span id="toL"></span>
    </div>
    <div class="days mob" id="days"></div>
</header>
<div class="toolbar">
    <div class="nav">
        <button class="btn" id="prev" aria-label="Precedente">‹</button>
        <span id="label"></span>
        <button class="btn" id="next" aria-label="Successivo">›</button>
        <button class="btn" id="today">Oggi</button>
    </div>
    <div class="views" id="views"></div>
</div>
<main id="view"></main>
<footer>
    <button class="btn" id="copyFav">Copia preferiti</button>
    <button class="btn" id="pasteFav">Incolla preferiti</button>
</footer>
<div class="sheet" id="sheet" hidden></div>
<script>document.write('<script src="app.js?v=' + Date.now() + '"><\/script>');</script>
</body>
</html>
