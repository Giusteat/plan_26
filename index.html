<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berlin Fitness Weekly Grid</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #212529;
            --text-muted: #6c757d;
            --primary: #4f46e5;
            --border-color: #e5e7eb;
            --grid-line: #e2e8f0;
            --now-color: #ea4335;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 8px 12px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        h1 {
            text-align: center;
            font-size: 1.25rem;
            margin: 0 0 6px 0;
        }

        .filters-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
        }

        .filter-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 3px 8px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.15s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .filter-btn:hover {
            border-color: var(--primary);
        }

        .filter-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .divider {
            max-width: 300px;
            height: 1px;
            background: var(--border-color);
            margin: 2px auto;
        }

        .calendar-grid-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            flex: 1;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: 55px repeat(7, minmax(140px, 1fr));
            min-width: 1050px;
        }

        .grid-header {
            background: #f1f5f9;
            padding: 6px 4px;
            text-align: center;
            font-weight: 600;
            font-size: 0.8rem;
            border-bottom: 2px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .time-col-header {
            background: #f1f5f9;
            border-bottom: 2px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }

        .time-slot {
            padding: 4px;
            font-size: 0.68rem;
            color: var(--text-muted);
            text-align: right;
            padding-right: 6px;
            border-bottom: 1px solid var(--grid-line);
            border-right: 1px solid var(--border-color);
            height: 60px;
            box-sizing: border-box;
        }

        .day-column {
            border-right: 1px solid var(--border-color);
            position: relative;
            background-image: linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
            background-size: 100% 60px;
        }

        .current-time-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background-color: var(--now-color);
            z-index: 50;
            pointer-events: none;
        }

        .current-time-line::before {
            content: '';
            position: absolute;
            left: -5px;
            top: -4px;
            width: 10px;
            height: 10px;
            background-color: var(--now-color);
            border-radius: 50%;
        }

        .cal-event {
            position: absolute;
            border-radius: 4px;
            padding: 2px 4px;
            font-size: 0.68rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            overflow: hidden;
            box-sizing: border-box;
            z-index: 2;
            cursor: pointer;
            transition: transform 0.15s ease, z-index 0.15s ease, box-shadow 0.15s ease;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .cal-event:hover {
            z-index: 999 !important;
            transform: scale(1.12);
            box-shadow: 0 6px 16px rgba(0,0,0,0.2);
            overflow: visible;
            white-space: normal;
            min-width: 160px;
            height: auto !important;
            min-height: 50px;
        }

        .cal-event-title {
            font-weight: 700;
            margin-bottom: 1px;
            line-height: 1.05;
        }

        .cal-event-time, .cal-event-details {
            opacity: 0.9;
            font-size: 0.62rem;
            line-height: 1.05;
        }

        .cat-matbarre { background-color: #e0f2fe; color: #0369a1; }
        .cat-reformer { background-color: #fce7f3; color: #be185d; }
        .cat-pole { background-color: #f3e8ff; color: #6b21a8; }
        .cat-yogasound { background-color: #dcfce7; color: #15803d; }
        .cat-strength { background-color: #ffedd5; color: #c2410c; }
        .cat-dance { background-color: #fef08a; color: #854d0e; }
        .cat-calisthenics { background-color: #ccfbf1; color: #0f766e; }
    </style>
</head>

    const daysConfig = [
        { name: "Lunedì", index: 0 },
        { name: "Martedì", index: 1 },
        { name: "Mercoledì", index: 2 },
        { name: "Giovedì", index: 3 },
        { name: "Venerdì", index: 4 },
        { name: "Sabato", index: 5 },
        { name: "Domenica", index: 6 }
    ];

    const startHour = 7;
    const endHour = 22;
    const hourHeight = 60;

    let selectedCategories = new Set(['all']);
    let selectedVenues = new Set(['all']);

    function timeToMinutes(timeStr) {
        const [h, m] = timeStr.split(':').map(Number);
        return h * 60 + m;
    }

    function toggleCategory(category, btnElement) {
        if (category === 'all') {
            selectedCategories.clear();
            selectedCategories.add('all');
            document.querySelectorAll('#categoryFilters .filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        } else {
            if (selectedCategories.has('all')) {
                selectedCategories.delete('all');
                document.querySelector('#categoryFilters .filter-btn[data-category="all"]').classList.remove('active');
            }

            if (selectedCategories.has(category)) {
                selectedCategories.delete(category);
                btnElement.classList.remove('active');
                if (selectedCategories.size === 0) {
                    selectedCategories.add('all');
                    document.querySelector('#categoryFilters .filter-btn[data-category="all"]').classList.add('active');
                }
            } else {
                selectedCategories.add(category);
                btnElement.classList.add('active');
            }
        }
        renderCalendar();
    }

    function toggleVenue(venue, btnElement) {
        if (venue === 'all') {
            selectedVenues.clear();
            selectedVenues.add('all');
            document.querySelectorAll('#venueFilters .filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        } else {
            if (selectedVenues.has('all')) {
                selectedVenues.delete('all');
                document.querySelector('#venueFilters .filter-btn[data-venue="all"]').classList.remove('active');
            }

            if (selectedVenues.has(venue)) {
                selectedVenues.delete(venue);
                btnElement.classList.remove('active');
                if (selectedVenues.size === 0) {
                    selectedVenues.add('all');
                    document.querySelector('#venueFilters .filter-btn[data-venue="all"]').classList.add('active');
                }
            } else {
                selectedVenues.add(venue);
                btnElement.classList.add('active');
            }
        }
        renderCalendar();
    }

    function layoutEventsForDay(events) {
        if (events.length === 0) return [];
        
        events.sort((a, b) => timeToMinutes(a.start) - timeToMinutes(b.start));

        const processed = events.map(ev => ({
            ...ev,
            startMins: timeToMinutes(ev.start),
            endMins: timeToMinutes(ev.end)
        }));

        let clusters = [];
        let currentCluster = [];

        processed.forEach(ev => {
            if (currentCluster.length === 0) {
                currentCluster.push(ev);
            } else {
                const clusterEnd = Math.max(...currentCluster.map(e => e.endMins));
                if (ev.startMins < clusterEnd) {
                    currentCluster.push(ev);
                } else {
                    clusters.push(currentCluster);
                    currentCluster = [ev];
                }
            }
        });
        if (currentCluster.length > 0) clusters.push(currentCluster);

        let finalEventsWithLayout = [];

        clusters.forEach(cluster => {
            let columns = [];
            cluster.forEach(ev => {
                let placed = false;
                for (let i = 0; i < columns.length; i++) {
                    let lastInCol = columns[i][columns[i].length - 1];
                    if (lastInCol.endMins <= ev.startMins) {
                        columns[i].push(ev);
                        ev.colIndex = i;
                        placed = true;
                        break;
                    }
                }
                if (!placed) {
                    ev.colIndex = columns.length;
                    columns.push([ev]);
                }
            });

            cluster.forEach(ev => {
                ev.totalCols = columns.length;
                finalEventsWithLayout.push(ev);
            });
        });

        return finalEventsWithLayout;
    }

    function renderCurrentTimeIndicator() {
        const now = new Date();
        const jsDay = now.getDay();
        const currentDayIndex = (jsDay + 6) % 7;

        const hours = now.getHours();
        const minutes = now.getMinutes();
        const currentTotalMins = hours * 60 + minutes;

        const gridStartMins = startHour * 60;
        const gridEndMins = endHour * 60;

        const dayCol = document.querySelector(`.day-column[data-day="${currentDayIndex}"]`);
        if (!dayCol) return;

        if (currentTotalMins >= gridStartMins && currentTotalMins <= gridEndMins) {
            const topPx = ((currentTotalMins - gridStartMins) / 60) * hourHeight;
            
            const timeLine = document.createElement('div');
            timeLine.className = 'current-time-line';
            timeLine.style.top = `${topPx}px`;
            
            dayCol.appendChild(timeLine);
        }
    }

    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        let html = '';

        html += `<div class="grid-header time-col-header">GMT+2</div>`;
        daysConfig.forEach(day => {
            html += `<div class="grid-header">${day.name}</div>`;
        });

        for (let hour = startHour; hour <= endHour; hour++) {
            const timeLabel = `${hour.toString().padStart(2, '0')}:00`;
            html += `<div class="time-slot">${timeLabel}</div>`;
            daysConfig.forEach(day => {
                html += `<div class="day-column" data-day="${day.index}" data-hour="${hour}"></div>`;
            });
        }

        grid.innerHTML = html;

        const filteredEvents = eventsData.filter(e => {
            const matchCategory = (selectedCategories.has('all') || selectedCategories.has(e.category));
            const matchVenue = (selectedVenues.has('all') || selectedVenues.has(e.studio));
            return matchCategory && matchVenue;
        });

        daysConfig.forEach(day => {
            const dayCol = grid.querySelector(`.day-column[data-day="${day.index}"]`);
            if (!dayCol) return;

            const dayEvents = filteredEvents.filter(e => e.day === day.index);
            const laidOutEvents = layoutEventsForDay(dayEvents);

            laidOutEvents.forEach(ev => {
                const startMins = timeToMinutes(ev.start);
                const endMins = timeToMinutes(ev.end);
                const gridStartMins = startHour * 60;

                const topPx = ((startMins - gridStartMins) / 60) * hourHeight;
                const durationMins = endMins - startMins;
                const heightPx = (durationMins / 60) * hourHeight;

                const widthPct = 100 / ev.totalCols;
                const leftPct = ev.colIndex * widthPct;

                const eventEl = document.createElement('div');
                eventEl.className = `cal-event cat-${ev.category}`;
                eventEl.style.top = `${topPx}px`;
                eventEl.style.height = `${Math.max(heightPx, 22)}px`;
                eventEl.style.left = `calc(${leftPct}% + 1px)`;
                eventEl.style.width = `calc(${widthPct}% - 2px)`;

                const fullText = `${ev.title}\n⏰ ${ev.start} - ${ev.end}\n📍 ${ev.studio}\n👤 ${ev.teacher}`;
                eventEl.setAttribute('title', fullText);

                eventEl.innerHTML = `
                    <div class="cal-event-title">${ev.title}</div>
                    <div class="cal-event-time">${ev.start} - ${ev.end}</div>
                    <div class="cal-event-details">${ev.studio} • ${ev.teacher}</div>
                `;
                dayCol.appendChild(eventEl);
            });
        });

        renderCurrentTimeIndicator();
    }

    window.onload = () => {
        renderCalendar();
        setInterval(renderCalendar, 60000);
    };
