name: Aggiorna orari

on:
  schedule:
    # ogni mattina alle 8 di Berlino: 6:00 UTC (ora legale) e 7:00 UTC (ora solare).
    # Quella che cade prima delle 8 si ferma; la seconda in estate si ferma da sola (dati di meno di 12 ore).
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:         # permette di lanciarlo a mano dal sito GitHub
    inputs:
      forza:
        description: "Scarica comunque, anche se i dati hanno meno di 12 ore"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dati
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa requests
        run: pip install requests

      - name: Scarica gli orari
        env:
          FORCE: ${{ inputs.forza }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=Europe/Berlin date +%-H)" -lt 8 ]; then
            echo "A Berlino non sono ancora le 8: aspetto il prossimo giro."
            exit 0
          fi
          python scraper/scrape.py

      - name: Salva i dati nel repository
        run: |
          git config user.name "orari-bot"
          git config user.email "orari-bot@users.noreply.github.com"
          git add data/corsi.json
          git diff --cached --quiet || git commit -m "Aggiorna orari"
          git pull --rebase origin main
          git push
