name: Aggiorna orari

on:
  schedule:
    - cron: "0 5 */5 * *"   # ogni 5 giorni, alle 5:00 UTC
  workflow_dispatch:         # permette di lanciarlo a mano dal sito GitHub
    inputs:
      forza:
        description: "Scarica comunque, anche se i dati hanno meno di 12 ore"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dati
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa requests
        run: pip install requests

      - name: Scarica gli orari
        env:
          FORCE: ${{ inputs.forza }}
        run: python scraper/scrape.py

      - name: Salva i dati nel repository
        run: |
          git config user.name "orari-bot"
          git config user.email "orari-bot@users.noreply.github.com"
          git add data/corsi.json
          git diff --cached --quiet || git commit -m "Aggiorna orari"
          git pull --rebase origin main
          git push
